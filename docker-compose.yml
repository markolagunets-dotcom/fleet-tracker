services:
  # Runs to completion before the server starts, then exits. Keeps the Prisma CLI
  # out of the image that serves traffic.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: file:/data/fleet-tracker.db
    volumes:
      - fleet-tracker-db:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: file:/data/fleet-tracker.db
    volumes:
      - fleet-tracker-db:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  fleet-tracker-db:
