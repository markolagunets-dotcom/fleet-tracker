services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: file:/data/fleet-tracker.db
    volumes:
      - fleet-tracker-db:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  fleet-tracker-db:
